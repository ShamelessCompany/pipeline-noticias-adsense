name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Compila
        run: python -m compileall -q fabrica src fabrica.py fabrica_app.py app.py main.py
      - name: Tests (Revisor de monetización y música propia)
        run: python -m unittest discover -s tests -t . -v
